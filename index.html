    // --- CONTRAST RATIO & WCAG MATH ---
    function hexToRgb(hex) {
      if (!hex) return null;
      let clean = hex.replace('#', '');
      if (clean.length === 3) {
        clean = clean.split('').map(c => c + c).join('');
      }
      if (clean.length !== 6) return null;
      const num = parseInt(clean, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function getLuminance(hex) {
      const rgb = hexToRgb(hex);
      if (!rgb) return 0;
      const [r, g, b] = [rgb.r, rgb.g, rgb.b].map(v => {
        v /= 255;
        return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }

    function getContrastRatio(hex1, hex2) {
      const l1 = getLuminance(hex1);
      const l2 = getLuminance(hex2);
      const lighter = Math.max(l1, l2);
      const darker = Math.min(l1, l2);
      return (lighter + 0.05) / (darker + 0.05);
    }

      // QR Data Type
      const [qrType, setQrType] = useState('url');

      // Form Data States
      const [urlData, setUrlData] = useState('https://gdgsrm.com');
      const [textData, setTextData] = useState('Welcome to Google Developer Groups on Campus, SRM Institute of Science and Technology!');
      const [emailData, setEmailData] = useState({
        to: 'hello@example.com',
        subject: 'QR Code Email',
        body: 'Hello, this is an example email generated with GDG QR Studio.'
      });
      const [phoneData, setPhoneData] = useState('+91 9876543210');
      const [wifiData, setWifiData] = useState({
        ssid: 'GDG_Campus_WiFi',
        password: 'DeveloperMode2026',
        encryption: 'WPA',
        hidden: false
      });
      const [vcardData, setVcardData] = useState({
        firstName: 'GDG',
        lastName: 'Lead',
        organization: 'GDG on Campus SRM',
        title: 'Technical Domain',
        phone: '+91 9876543210',
        email: 'hello@example.com',
        url: 'https://gdgsrm.com'
      });

      const [showWifiPassword, setShowWifiPassword] = useState(false);

      // Customization Controls
      const [size, setSize] = useState(340);
      const [margin, setMargin] = useState(10);
      const [errorCorrection, setErrorCorrection] = useState('Q');

      // Dot & Corner Shapes
      const [dotType, setDotType] = useState('rounded');
      const [cornerSquareType, setCornerSquareType] = useState('extra-rounded');
      const [cornerDotType, setCornerDotType] = useState('dot');

      // Colors & Gradients
      const [dotsColor, setDotsColor] = useState('#4285F4');
      const [bgColor, setBgColor] = useState('#ffffff');
      const [cornerColor, setCornerColor] = useState('#4285F4');
      const [customCornerColor, setCustomCornerColor] = useState(false);

      // Gradient Controls
      const [gradientEnabled, setGradientEnabled] = useState(true);
      const [gradientType, setGradientType] = useState('linear');
      const [gradientColor1, setGradientColor1] = useState('#4285F4');
      const [gradientColor2, setGradientColor2] = useState('#EA4335');
      const [gradientAngle, setGradientAngle] = useState(45);

      // Logo Controls
      const [logoImage, setLogoImage] = useState(LOGO_PRESETS[1].dataUri);
      const [activeLogoPresetId, setActiveLogoPresetId] = useState('gdg');
      const [logoSize, setLogoSize] = useState(0.24);
      const [logoMargin, setLogoMargin] = useState(4);
      const [hideBehindLogo, setHideBehindLogo] = useState(true);

      // Toast & Clipboard Feedback
      const [toastMessage, setToastMessage] = useState(null);
      const [copyStatus, setCopyStatus] = useState(false);

      // Local Persistence History
      const [history, setHistory] = useState(() => {
        try {
          const saved = localStorage.getItem('gdg_qr_history');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      const qrContainerRef = useRef(null);
      const qrCodeInstanceRef = useRef(null);

      // Dark Mode Synchronization
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('gdg_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('gdg_theme', 'light');
        }
      }, [darkMode]);

      // Save History to LocalStorage
      useEffect(() => {
        try {
          localStorage.setItem('gdg_qr_history', JSON.stringify(history));
        } catch (e) {
          console.error("Failed to save history", e);
        }
      }, [history]);

      const showToast = useCallback((msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3200);
      }, []);

      // Auto-escalate error correction when logo is present for reliability
      useEffect(() => {
        if (logoImage && errorCorrection !== 'H' && errorCorrection !== 'Q') {
          setErrorCorrection('H');
          showToast('Upgraded Error Correction to Level H for optimal scan reliability with logo!');
        }
      }, [logoImage]);

      // Formatted Payload Calculation
      const formattedPayload = useMemo(() => {
        switch (qrType) {
          case 'url': {
            let u = urlData.trim();
            if (!u) return 'https://gdgsrm.com';
            if (!/^https?:\/\//i.test(u)) {
              u = 'https://' + u;
            }
            return u;
          }
          case 'text':
            return textData || ' ';
          case 'email': {
            const subject = encodeURIComponent(emailData.subject || '');
            const body = encodeURIComponent(emailData.body || '');
            return 'mailto:' + emailData.to.trim() + '?subject=' + subject + '&body=' + body;
          }
          case 'phone': {
            const cleaned = phoneData.trim().replace(/\s+/g, '');
            return 'tel:' + cleaned;
          }
          case 'wifi': {
            const escapeWifi = (str) => str.replace(/([\\;,:"])/g, '\\$1');
            const enc = wifiData.encryption;
            const ssid = escapeWifi(wifiData.ssid);
            const pass = escapeWifi(wifiData.password);
            const hidden = wifiData.hidden ? 'true' : 'false';
            return 'WIFI:S:' + ssid + ';T:' + enc + ';P:' + pass + ';H:' + hidden + ';;';
          }
          case 'vcard': {
            return 'BEGIN:VCARD\nVERSION:3.0\nN:' + vcardData.lastName + ';' + vcardData.firstName + ';;;\nFN:' + vcardData.firstName + ' ' + vcardData.lastName + '\nORG:' + vcardData.organization + '\nTITLE:' + vcardData.title + '\nTEL:' + vcardData.phone + '\nEMAIL:' + vcardData.email + '\nURL:' + vcardData.url + '\nEND:VCARD';
          }
          default:
            return 'https://gdgsrm.com';
        }
      }, [qrType, urlData, textData, emailData, phoneData, wifiData, vcardData]);

      // Validation
      const validationErrors = useMemo(() => {
        const errors = [];
        if (qrType === 'url') {
          if (!urlData.trim()) errors.push("URL cannot be empty.");
        } else if (qrType === 'email') {
          if (!emailData.to.trim()) {
            errors.push("Recipient email address is required.");
          } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailData.to.trim())) {
            errors.push("Invalid recipient email address format.");
          }
        } else if (qrType === 'phone') {
          if (!phoneData.trim()) {
            errors.push("Phone number is required.");
          } else if (!/^[+0-9\s\-()]{6,20}$/.test(phoneData.trim())) {
            errors.push("Phone number should contain valid digits.");
          }
        } else if (qrType === 'wifi') {
          if (!wifiData.ssid.trim()) {
            errors.push("Wi-Fi Network Name (SSID) cannot be empty.");
          }
          if (wifiData.encryption !== 'nopass' && wifiData.password.length < 8 && wifiData.password.length > 0) {
            errors.push("WPA/WPA2 passwords typically require at least 8 characters.");
          }
        } else if (qrType === 'text') {
          if (!textData.trim()) errors.push("Text content cannot be empty.");
        }
        return errors;
      }, [qrType, urlData, emailData, phoneData, wifiData, textData]);

      // Contrast Score & Scannability Assessment
      const effectiveDotColor = gradientEnabled ? gradientColor1 : dotsColor;
      const contrastRatio = useMemo(() => {
        return getContrastRatio(effectiveDotColor, bgColor);
      }, [effectiveDotColor, bgColor]);

      const contrastStatus = useMemo(() => {
        if (contrastRatio >= 6.5) {
          return { label: 'Optimal Scannability', color: 'emerald', text: 'High contrast ensures fast scan by any camera.' };
        } else if (contrastRatio >= 4.0) {
          return { label: 'Good Contrast', color: 'blue', text: 'Easily readable in normal ambient lighting.' };
        } else if (contrastRatio >= 2.8) {
          return { label: 'Fair / Low Contrast', color: 'amber', text: 'Some budget cameras or dim environments may struggle.' };
        } else {
          return { label: 'Poor Readability Warning', color: 'red', text: 'Foreground and background are too similar. High risk of scan failure.' };
        }
      }, [contrastRatio]);

      // Real-Time QR Rendering
      useEffect(() => {
        if (!qrContainerRef.current) return;

        const options = {
          width: size,
          height: size,
          type: 'canvas',
          data: formattedPayload || 'https://gdgsrm.com',
          margin: margin,
          qrOptions: {
            typeNumber: 0,
            mode: 'Byte',
            errorCorrectionLevel: errorCorrection
          },
          imageOptions: {
            hideBackgroundDots: hideBehindLogo,
            imageSize: logoSize,
            margin: logoMargin,
            crossOrigin: 'anonymous'
          },
          dotsOptions: {
            type: dotType,
            color: gradientEnabled ? undefined : dotsColor,
            gradient: gradientEnabled ? {
              type: gradientType,
              rotation: (gradientAngle * Math.PI) / 180,
              colorStops: [
                { offset: 0, color: gradientColor1 },
                { offset: 1, color: gradientColor2 }
              ]
            } : undefined
          },
          backgroundOptions: {
            color: bgColor
          },
          cornersSquareOptions: {
            type: cornerSquareType,
            color: customCornerColor ? cornerColor : (gradientEnabled ? gradientColor1 : dotsColor)
          },
          cornersDotOptions: {
            type: cornerDotType,
            color: customCornerColor ? cornerColor : (gradientEnabled ? gradientColor1 : dotsColor)
          }
        };

        if (logoImage) {
          options.image = logoImage;
        } else {
          options.image = '';
        }

        if (!qrCodeInstanceRef.current) {
          qrCodeInstanceRef.current = new QRCodeStyling(options);
          qrContainerRef.current.innerHTML = '';
          qrCodeInstanceRef.current.append(qrContainerRef.current);
        } else {
          qrCodeInstanceRef.current.update(options);
        }
      }, [
        formattedPayload,
        size,
        margin,
        errorCorrection,
        dotType,
        cornerSquareType,
        cornerDotType,
        dotsColor,
        bgColor,
        cornerColor,
        customCornerColor,
        gradientEnabled,
        gradientType,
        gradientColor1,
        gradientColor2,
        gradientAngle,
        logoImage,
        logoSize,
        logoMargin,
        hideBehindLogo
      ]);

      // Apply Visual Preset
      const applyPreset = (preset) => {
        setDotsColor(preset.dotsColor);
        setBgColor(preset.bgColor);
        setDotType(preset.dotType);
        setCornerSquareType(preset.cornerSquareType);
        setCornerDotType(preset.cornerDotType);
        setGradientEnabled(preset.gradientEnabled);
        if (preset.gradientEnabled) {
          setGradientType(preset.gradientType || 'linear');
          setGradientColor1(preset.gradientColor1 || preset.dotsColor);
          setGradientColor2(preset.gradientColor2 || '#EA4335');
          setGradientAngle(preset.gradientAngle !== undefined ? preset.gradientAngle : 45);
        }
        if (preset.cornerColor) {
          setCustomCornerColor(true);
          setCornerColor(preset.cornerColor);
        } else {
          setCustomCornerColor(false);
        }
        if (preset.logoPreset) {
          const match = LOGO_PRESETS.find(p => p.id === preset.logoPreset);
          if (match) {
            setLogoImage(match.dataUri);
            setActiveLogoPresetId(match.id);
          }
        }
        showToast("Preset '" + preset.name + "' applied!");
      };

      // Download Handler (PNG, SVG)
      const handleDownload = async (extension) => {
        if (!qrCodeInstanceRef.current) return;
        const filename = 'gdg-qr-' + qrType + '-' + Date.now();
        try {
          await qrCodeInstanceRef.current.download({
            name: filename,
            extension: extension
          });
          showToast('Downloaded ' + extension.toUpperCase() + ' successfully!');
          saveToHistory(filename);
        } catch (err) {
          console.error("Download error:", err);
          showToast("Download failed. Please try again.");
        }
      };

      // Copy to Clipboard
      const handleCopyToClipboard = async () => {
        try {
          if (!qrContainerRef.current) return;
          const canvas = qrContainerRef.current.querySelector('canvas');
          if (canvas) {
            canvas.toBlob(async (blob) => {
              if (blob && navigator.clipboard && navigator.clipboard.write) {
                await navigator.clipboard.write([
                  new ClipboardItem({ 'image/png': blob })
                ]);
                setCopyStatus(true);
                showToast("QR Code image copied directly to clipboard!");
                setTimeout(() => setCopyStatus(false), 2500);
              } else {
                throw new Error("ClipboardItem not supported");
              }
            }, 'image/png');
          } else {
            throw new Error("Canvas not found");
          }
        } catch (err) {
          try {
            await navigator.clipboard.writeText(formattedPayload);
            showToast("Copied QR raw payload to clipboard!");
          } catch (e2) {
            showToast("Clipboard write failed.");
          }
        }
      };

      // Save to History
      const saveToHistory = (titleOverride) => {
        let summary = '';
        switch (qrType) {
          case 'url': summary = urlData; break;
          case 'text': summary = textData.slice(0, 40) + (textData.length > 40 ? '...' : ''); break;
          case 'email': summary = emailData.to; break;
          case 'phone': summary = phoneData; break;
          case 'wifi': summary = 'SSID: ' + wifiData.ssid; break;
          case 'vcard': summary = vcardData.firstName + ' ' + vcardData.lastName; break;
          default: summary = formattedPayload.slice(0, 30);
        }

        const newItem = {
          id: Date.now().toString(),
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' }),
          type: qrType,
          summary: summary || 'Untitled QR Code',
          payload: formattedPayload,
          config: {
            qrType, urlData, textData, emailData, phoneData, wifiData, vcardData,
            size, margin, errorCorrection, dotType, cornerSquareType, cornerDotType,
            dotsColor, bgColor, cornerColor, customCornerColor, gradientEnabled,
            gradientType, gradientColor1, gradientColor2, gradientAngle, logoImage,
            activeLogoPresetId, logoSize, logoMargin, hideBehindLogo
          }
        };

        setHistory(prev => [newItem, ...prev.filter(item => item.payload !== formattedPayload)].slice(0, 20));
        showToast("Saved to Recent QR Codes history!");
      };

      // Restore from History
      const restoreFromHistory = (item) => {
        const c = item.config;
        if (!c) return;
        setQrType(c.qrType || 'url');
        if (c.urlData) setUrlData(c.urlData);
        if (c.textData) setTextData(c.textData);
        if (c.emailData) setEmailData(c.emailData);
        if (c.phoneData) setPhoneData(c.phoneData);
        if (c.wifiData) setWifiData(c.wifiData);
        if (c.vcardData) setVcardData(c.vcardData);

        if (c.size) setSize(c.size);
        if (c.margin !== undefined) setMargin(c.margin);
        if (c.errorCorrection) setErrorCorrection(c.errorCorrection);
        if (c.dotType) setDotType(c.dotType);
        if (c.cornerSquareType) setCornerSquareType(c.cornerSquareType);
        if (c.cornerDotType) setCornerDotType(c.cornerDotType);
        if (c.dotsColor) setDotsColor(c.dotsColor);
        if (c.bgColor) setBgColor(c.bgColor);
        if (c.cornerColor) setCornerColor(c.cornerColor);
        if (c.customCornerColor !== undefined) setCustomCornerColor(c.customCornerColor);

        if (c.gradientEnabled !== undefined) setGradientEnabled(c.gradientEnabled);
        if (c.gradientType) setGradientType(c.gradientType);
        if (c.gradientColor1) setGradientColor1(c.gradientColor1);
        if (c.gradientColor2) setGradientColor2(c.gradientColor2);
        if (c.gradientAngle !== undefined) setGradientAngle(c.gradientAngle);

        setLogoImage(c.logoImage || '');
        setActiveLogoPresetId(c.activeLogoPresetId || null);
        if (c.logoSize) setLogoSize(c.logoSize);
        if (c.logoMargin !== undefined) setLogoMargin(c.logoMargin);
        if (c.hideBehindLogo !== undefined) setHideBehindLogo(c.hideBehindLogo);

        showToast('Restored "' + item.summary + '" from history!');
      };

      const deleteHistoryItem = (id, e) => {
        e.stopPropagation();
        setHistory(prev => prev.filter(item => item.id !== id));
        showToast("Item deleted from history.");
      };

      const clearAllHistory = () => {
        if (confirm("Clear entire history?")) {
          setHistory([]);
          showToast("History cleared.");
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
          alert("Please select an image smaller than 2MB.");
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          setLogoImage(event.target.result);
          setActiveLogoPresetId(null);
          showToast("Custom logo uploaded!");
        };
        reader.readAsDataURL(file);
      };

      const resetToDefaults = () => {
        if (confirm("Reset to GDG default settings?")) {
          applyPreset(VISUAL_PRESETS[1]);
          setSize(340);
          setMargin(10);
          setErrorCorrection('Q');
          showToast("Reset complete!");
        }
      };
      return (
        <div className="flex flex-col min-h-screen">
          {/* TOAST ALERT */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900/95 dark:bg-white/95 text-white dark:text-slate-900 px-5 py-3 rounded-2xl shadow-2xl backdrop-blur-md flex items-center gap-3 border border-white/10 dark:border-slate-800 animate-bounce">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
              <p className="text-sm font-semibold">{toastMessage}</p>
            </div>
          )}

         {/* HEADER / NAVIGATION */}
<header className="sticky top-0 z-40 bg-white/85 dark:bg-slate-900/85 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">

           </div>

        {/* MAIN APPLICATION WORKSPACE */}

              {/* LEFT COLUMN: CONTROL TABS */}

                          <div>
                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Color Stop 1</label>
                            <div className="flex items-center gap-2">
                              <input
                                type="color"
                                value={gradientColor1}
                                onChange={(e) => setGradientColor1(e.target.value)}
                                className="w-10 h-10 rounded-xl cursor-pointer border border-slate-200 p-1 bg-white"
                              />
                              <input
                                type="text"
                                value={gradientColor1}
                                onChange={(e) => setGradientColor1(e.target.value)}
                                className="w-24 px-2 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-mono"
                              />
                            </div>
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Color Stop 2</label>
                            <div className="flex items-center gap-2">
                              <input
                                type="color"
                                value={gradientColor2}
                                onChange={(e) => setGradientColor2(e.target.value)}
                                className="w-10 h-10 rounded-xl cursor-pointer border border-slate-200 p-1 bg-white"
                              />
                              <input
                                type="text"
                                value={gradientColor2}
                                onChange={(e) => setGradientColor2(e.target.value)}
                                className="w-24 px-2 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-mono"
                              />
                            </div>
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-3 pt-2">
                          <div>
                            <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Gradient Type</label>
                            <div className="flex gap-2">
                              <button
                                onClick={() => setGradientType('linear')}
                                className={"flex-1 py-1.5 rounded-lg text-xs font-medium border " + (gradientType === 'linear' ? "border-blue-500 bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400" : "border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800")}
                              >
                                Linear
                              </button>
                              <button
                                onClick={() => setGradientType('radial')}
                                className={"flex-1 py-1.5 rounded-lg text-xs font-medium border " + (gradientType === 'radial' ? "border-blue-500 bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400" : "border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800")}
                              >
                                Radial
                              </button>
                            </div>
                          </div>

                          {gradientType === 'linear' && (
                            <div>
                              <div className="flex justify-between items-center text-xs mb-1">
                                <span className="font-semibold text-slate-500 dark:text-slate-400">Angle</span>
                                <span className="font-mono text-blue-600 dark:text-blue-400">{gradientAngle}°</span>
                              </div>
                              <input
                                type="range"
                                min="0"
                                max="360"
                                step="15"
                                value={gradientAngle}
                                onChange={(e) => setGradientAngle(Number(e.target.value))}
                                className="w-full accent-blue-600 cursor-pointer"
                              />
                            </div>
                          )}
                        </div>
                      </div>
                    )}

                    <div className="pt-2 border-t border-slate-100 dark:border-slate-800 space-y-3">
                      <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400">
                        Background Canvas Color
                      </label>
                      <div className="flex items-center gap-3">
                        <input
                          type="color"
                          value={bgColor}
                          onChange={(e) => setBgColor(e.target.value)}
                          className="w-12 h-12 rounded-xl cursor-pointer border border-slate-200 dark:border-slate-700 p-1 bg-white dark:bg-slate-800"
                        />
                        <input
                          type="text"
                          value={bgColor}
                          onChange={(e) => setBgColor(e.target.value)}
                          className="w-32 px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-mono uppercase"
                        />
                        <div className="flex items-center gap-1.5">
                          {['#ffffff', '#f8fafc', '#0f172a', '#1e293b', '#fff7ed'].map((swatch) => (
                            <button
                              key={swatch}
                              onClick={() => setBgColor(swatch)}
                              className="w-6 h-6 rounded-full border border-black/20 transition-transform hover:scale-110"
                              style={{ backgroundColor: swatch }}
                            />
                          ))}
                        </div>
                      </div>
                    </div>

                    <div className="pt-2 border-t border-slate-100 dark:border-slate-800 space-y-3">
                      <div className="flex items-center justify-between">
                        <label className="text-xs font-semibold text-slate-600 dark:text-slate-400">
                          Custom Corner Eye Color Override
                        </label>
                        <input
                          type="checkbox"
                          checked={customCornerColor}
                          onChange={(e) => setCustomCornerColor(e.target.checked)}
                          className="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-4 h-4 cursor-pointer"
                        />
                      </div>
                      {customCornerColor && (
                        <div className="flex items-center gap-3">
                          <input
                            type="color"
                            value={cornerColor}
                            onChange={(e) => setCornerColor(e.target.value)}
                            className="w-10 h-10 rounded-xl cursor-pointer border border-slate-200 p-1"
                          />
                          <input
                            type="text"
                            value={cornerColor}
                            onChange={(e) => setCornerColor(e.target.value)}
                            className="w-28 px-3 py-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-mono uppercase"
                          />
                        </div>
                      )}
                    </div>
                  </div>
                )}
                {/* TAB 5: LOGO */}
                {activeTab === 'logo' && (
                  <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-sm space-y-6">
                    <div>
                      <h2 className="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <span className="w-6 h-6 rounded-lg bg-blue-100 dark:bg-blue-950 text-blue-600 dark:text-blue-400 flex items-center justify-center text-xs font-bold">5</span>
                        Center Logo & Branding
                      </h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                        Add center logos to make QR codes branded and recognizable.
                      </p>
                    </div>

                    <div className="space-y-3">
                      <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                        Select Preset Icon
                      </label>
                      <div className="grid grid-cols-4 sm:grid-cols-7 gap-2">
                        {LOGO_PRESETS.map((preset) => (
                          <button
                            key={preset.id}
                            onClick={() => {
                              setLogoImage(preset.dataUri);
                              setActiveLogoPresetId(preset.id);
                              showToast('Applied ' + preset.name + ' logo!');
                            }}
                            className={"p-2 rounded-2xl border flex flex-col items-center justify-center gap-1.5 transition-all " + (activeLogoPresetId === preset.id ? "border-blue-500 bg-blue-50 dark:bg-blue-950/60 ring-2 ring-blue-500/20" : "border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 hover:border-slate-300")}
                          >
                            <img src={preset.dataUri} alt={preset.name} className="w-7 h-7 object-contain" />
                            <span className="text-[10px] text-slate-600 dark:text-slate-300 font-medium truncate w-full text-center">
                              {preset.name}
                            </span>
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="pt-2 border-t border-slate-100 dark:border-slate-800 space-y-3">
                      <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                        Or Upload Custom Image (PNG, SVG, JPG)
                      </label>
                      <div className="flex items-center gap-3">
                        <label className="px-4 py-2.5 bg-blue-50 dark:bg-blue-950/50 hover:bg-blue-100 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-800 rounded-xl text-xs font-semibold cursor-pointer transition-colors flex items-center gap-2">
                          <Icon name="image" className="w-4 h-4" />
                          <span>Choose File...</span>
                          <input
                            type="file"
                            accept="image/*"
                            onChange={handleFileUpload}
                            className="hidden"
                          />
                        </label>

                        {logoImage && (
                          <button
                            onClick={() => {
                              setLogoImage('');
                              setActiveLogoPresetId(null);
                              showToast("Logo removed.");
                            }}
                            className="px-3 py-2 text-xs font-medium text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded-xl transition-colors flex items-center gap-1.5"
                          >
                            <Icon name="trash" className="w-3.5 h-3.5" />
                            <span>Remove Logo</span>
                          </button>
                        )}
                      </div>
                    </div>

                    {logoImage && (
                      <div className="pt-2 border-t border-slate-100 dark:border-slate-800 space-y-4">
                        <div>
                          <div className="flex justify-between items-center text-xs mb-1 font-semibold">
                            <span className="text-slate-600 dark:text-slate-400">Logo Scaling</span>
                            <span className="text-blue-600 dark:text-blue-400 font-mono">{Math.round(logoSize * 100)}%</span>
                          </div>
                          <input
                            type="range"
                            min="0.15"
                            max="0.36"
                            step="0.01"
                            value={logoSize}
                            onChange={(e) => setLogoSize(Number(e.target.value))}
                            className="w-full accent-blue-600 cursor-pointer"
                          />
                        </div>

                        <div>
                          <div className="flex justify-between items-center text-xs mb-1 font-semibold">
                            <span className="text-slate-600 dark:text-slate-400">Logo Margin</span>
                            <span className="text-blue-600 dark:text-blue-400 font-mono">{logoMargin}px</span>
                          </div>
                          <input
                            type="range"
                            min="0"
                            max="16"
                            step="1"
                            value={logoMargin}
                            onChange={(e) => setLogoMargin(Number(e.target.value))}
                            className="w-full accent-blue-600 cursor-pointer"
                          />
                        </div>

                        <label className="flex items-center gap-2 cursor-pointer pt-1">
                          <input
                            type="checkbox"
                            checked={hideBehindLogo}
                            onChange={(e) => setHideBehindLogo(e.target.checked)}
                            className="rounded border-slate-300 text-blue-600 focus:ring-blue-500 w-4 h-4 cursor-pointer"
                          />
                          <span className="text-xs text-slate-600 dark:text-slate-400 font-medium">
                            Clear QR dots behind logo (prevents scanning visual noise)
                          </span>
                        </label>
                      </div>
                    )}
                  </div>
                )}

                {/* TAB 6: HISTORY */}
                {activeTab === 'history' && (
                  <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-sm space-y-6">
                    <div className="flex items-center justify-between">
                      <div>
                        <h2 className="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                          <span className="w-6 h-6 rounded-lg bg-blue-100 dark:bg-blue-950 text-blue-600 dark:text-blue-400 flex items-center justify-center text-xs font-bold">6</span>
                          Recent QR Codes
                        </h2>
                        <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                          Stored safely in localStorage. Click any card to restore its exact configuration.
                        </p>
                      </div>
                      {history.length > 0 && (
                        <button
                          onClick={clearAllHistory}
                          className="text-xs text-rose-600 dark:text-rose-400 hover:underline flex items-center gap-1"
                        >
                          <Icon name="trash" className="w-3.5 h-3.5" />
                          <span>Clear All</span>
                        </button>
                      )}
                    </div>

                    {history.length === 0 ? (
                      <div className="py-12 text-center text-slate-400 dark:text-slate-500">
                        <Icon name="history" className="w-10 h-10 mx-auto mb-3 opacity-40" />
                        <p className="text-sm font-medium">No saved QR codes yet.</p>
                        <p className="text-xs mt-1">Downloaded codes and manual saves persist here.</p>
                        <button
                          onClick={() => saveToHistory()}
                          className="mt-4 px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold shadow-sm hover:bg-blue-700 transition-colors"
                        >
                          Save Current QR Code
                        </button>
                      </div>
                    ) : (
                      <div className="space-y-2.5 max-h-[440px] overflow-y-auto custom-scrollbar pr-1">
                        {history.map((item) => (
                          <div
                            key={item.id}
                            onClick={() => restoreFromHistory(item)}
                            className="p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 hover:border-blue-500 dark:hover:border-blue-500 bg-slate-50/50 dark:bg-slate-800/40 hover:bg-blue-50/20 cursor-pointer transition-all flex items-center justify-between group"
                          >
                            <div className="flex items-center gap-3 min-w-0">
                              <div className="w-9 h-9 rounded-xl bg-blue-100 dark:bg-blue-950/80 text-blue-600 dark:text-blue-400 flex items-center justify-center flex-shrink-0">
                                <Icon name="qrcode" className="w-5 h-5" />
                              </div>
                              <div className="min-w-0">
                                <div className="flex items-center gap-2">
                                  <span className="text-xs font-bold text-slate-900 dark:text-white truncate">
                                    {item.summary}
                                  </span>
                                  <span className="text-[10px] uppercase font-semibold px-2 py-0.2 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                                    {item.type}
                                  </span>
                                </div>
                                <p className="text-[11px] text-slate-400 font-mono truncate mt-0.5 max-w-[280px]">
                                  {item.timestamp} • {item.payload}
                                </p>
                              </div>
                            </div>

                            <div className="flex items-center gap-2">
                              <button
                                onClick={(e) => deleteHistoryItem(item.id, e)}
                                title="Delete this entry"
                                className="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/50 transition-colors"
                              >
                                <Icon name="trash" className="w-4 h-4" />
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

              </div>
              {/* RIGHT COLUMN: STICKY LIVE PREVIEW */}
              <div className="lg:col-span-5 lg:sticky lg:top-24 space-y-5">
                
                <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 border border-slate-200 dark:border-slate-800 shadow-xl relative overflow-hidden">
                  
                  <div className="flex items-center justify-between mb-4">
                    <div>
                      <span className="text-xs font-bold uppercase tracking-wider text-blue-600 dark:text-blue-400">
                        Live Preview
                      </span>
                      <h3 className="text-sm font-semibold text-slate-800 dark:text-slate-200">
                        Real-time Canvas
                      </h3>
                    </div>

                    <div className="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 px-2.5 py-1 rounded-xl">
                      <span className="text-[11px] text-slate-400 font-medium">Res:</span>
                      <select
                        value={size}
                        onChange={(e) => setSize(Number(e.target.value))}
                        className="bg-transparent text-xs font-bold text-slate-800 dark:text-slate-200 focus:outline-none cursor-pointer"
                      >
                        <option value={280}>280px (Fast)</option>
                        <option value={340}>340px (Standard)</option>
                        <option value={512}>512px (HD)</option>
                        <option value={1024}>1024px (Ultra HD)</option>
                      </select>
                    </div>
                  </div>

                  {/* QR CANVAS CONTAINER */}
                  <div className="p-4 rounded-2xl bg-slate-100/70 dark:bg-slate-950/60 border border-slate-200/80 dark:border-slate-800 flex items-center justify-center min-h-[360px] overflow-hidden">
                    <div
                      ref={qrContainerRef}
                      className="shadow-2xl rounded-2xl overflow-hidden transition-all duration-300 hover:scale-[1.02]"
                    />
                  </div>

                  {/* CONTRAST & SCAN RELIABILITY BADGE */}
                  <div className="mt-4 p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 space-y-2">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span className={"w-2.5 h-2.5 rounded-full " + (contrastStatus.color === 'emerald' ? 'bg-emerald-500 animate-pulse' : contrastStatus.color === 'blue' ? 'bg-blue-500' : contrastStatus.color === 'amber' ? 'bg-amber-500' : 'bg-red-500')} />
                        <span className="text-xs font-bold text-slate-800 dark:text-slate-200">
                          {contrastStatus.label}
                        </span>
                      </div>
                      <span className="text-xs font-mono font-semibold px-2 py-0.5 rounded-md bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-300">
                        {contrastRatio.toFixed(2)} : 1
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-500 dark:text-slate-400">
                      {contrastStatus.text}
                    </p>
                  </div>

                  {/* RAW PAYLOAD INSPECTOR */}
                  <div className="mt-3 p-2.5 rounded-xl bg-slate-100/60 dark:bg-slate-800/40 text-[11px] font-mono text-slate-500 dark:text-slate-400 truncate flex items-center justify-between gap-2">
                    <span className="truncate">Payload: {formattedPayload}</span>
                    <button
                      onClick={() => {
                        navigator.clipboard.writeText(formattedPayload);
                        showToast("Payload string copied!");
                      }}
                      className="text-blue-600 dark:text-blue-400 hover:underline flex-shrink-0 font-sans text-xs font-semibold"
                    >
                      Copy
                    </button>
                  </div>

                  {/* PRIMARY DOWNLOAD BUTTONS */}
                  <div className="mt-5 grid grid-cols-2 gap-3">
                    <button
                      onClick={() => handleDownload('png')}
                      className="py-3 px-4 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2 hover:-translate-y-0.5"
                    >
                      <Icon name="download" className="w-4 h-4" />
                      <span>Download PNG</span>
                    </button>

                    <button
                      onClick={() => handleDownload('svg')}
                      className="py-3 px-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs sm:text-sm shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center gap-2 hover:-translate-y-0.5"
                    >
                      <Icon name="download" className="w-4 h-4" />
                      <span>Download SVG</span>
                    </button>
                  </div>

                  {/* SECONDARY UTILITIES */}
                  <div className="mt-2.5 grid grid-cols-2 gap-2.5">
                    <button
                      onClick={handleCopyToClipboard}
                      className="py-2.5 px-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold text-xs transition-colors flex items-center justify-center gap-1.5"
                    >
                      <Icon name={copyStatus ? 'check' : 'copy'} className="w-3.5 h-3.5 text-blue-500" />
                      <span>{copyStatus ? 'Copied!' : 'Copy Image'}</span>
                    </button>

                    <button
                      onClick={() => saveToHistory()}
                      className="py-2.5 px-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold text-xs transition-colors flex items-center justify-center gap-1.5"
                    >
                      <Icon name="history" className="w-3.5 h-3.5 text-emerald-500" />
                      <span>Save to History</span>
                    </button>
                  </div>

                </div>



              </div>

            </div>
          </main>

          {/* FOOTER */}
          <footer className="mt-auto border-t border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 py-6 text-center text-xs text-slate-500 dark:text-slate-400">
            <div className="max-w-7xl mx-auto px-4">
              <p>GDG QR Studio • Interactive QR Code Generator &amp; Designer</p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
